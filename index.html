<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>தேநீர் கடை - Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--leaf:#1f4d3a;--leaf2:#2f6b52;--bg:#eaf0e4;--card:#fff;--chai:#e29a2b;--ink:#17261e;--mute:#66766b;--line:#d5decd;--red:#b3392f}
*{box-sizing:border-box;margin:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:"Baloo Thambi 2","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:90px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--chai);outline-offset:2px}
header{background:var(--leaf);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
h1{font-size:24px;font-weight:800;line-height:1.2}
.today{text-align:right;font-size:13px;opacity:.85;line-height:1.2}
.today b{display:block;font-size:20px;color:var(--chai)}
nav{display:flex;gap:4px;max-width:1100px;margin:10px auto 0}
nav button{flex:1;background:transparent;color:#cfe3d6;padding:9px 4px;font-weight:700;font-size:16px;border-radius:12px 12px 0 0}
nav button.on{background:var(--bg);color:var(--leaf)}
main{max-width:1100px;margin:0 auto;padding:16px}
section{display:none}
section.on{display:block}
.split{display:grid;gap:16px}
@media(min-width:820px){.split{grid-template-columns:1fr 380px;align-items:start}#billPanel{position:sticky;top:12px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.it{position:relative;background:var(--card);border-radius:16px;padding:12px 10px;text-align:left;border:2px solid transparent;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:0;min-height:96px;transition:transform .08s}
.it:active{transform:scale(.96)}
.it.on{border-color:var(--leaf2);background:#f4faf5}
.it .n{font-weight:800;font-size:18px;line-height:1.15}
.it .e{font-size:12.5px;color:var(--mute)}
.it .p{margin-top:auto;font-weight:700;color:var(--leaf2);font-size:17px}
.it .q{position:absolute;top:8px;right:8px;background:var(--chai);color:#3a2400;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:14px;padding:0 6px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card h2{font-size:19px;margin-bottom:8px}
.name{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fafcf8;margin-bottom:10px}
.lines{min-height:56px}
.empty{color:var(--mute);padding:14px 0;text-align:center}
.ln{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln .t{flex:1;font-weight:700;line-height:1.15}
.ln .t small{display:block;color:var(--mute);font-weight:500}
.step{display:flex;align-items:center;gap:2px}
.step button{width:32px;height:32px;border-radius:10px;background:#edf3ea;font-size:18px;font-weight:800;color:var(--leaf)}
.step span{min-width:26px;text-align:center;font-weight:800}
.ln .a{min-width:58px;text-align:right;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-weight:800}
.total span:last-child{font-size:38px;color:var(--leaf)}
.pay{display:flex;gap:8px;margin:6px 0 12px}
.pay button{flex:1;padding:10px;border-radius:12px;background:#edf3ea;font-weight:800;border:2px solid transparent}
.pay button.on{background:#fff;border-color:var(--leaf2);color:var(--leaf)}
.cta{width:100%;background:var(--leaf);color:#fff;font-weight:800;font-size:20px;padding:14px;border-radius:16px;box-shadow:0 5px 0 #12301f;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #12301f}
.cta:disabled{background:#a9b9ae;box-shadow:0 5px 0 #8c9b91;cursor:not-allowed}
.ghost{background:transparent;color:var(--red);font-weight:700;padding:10px;width:100%;margin-top:6px}
#bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;background:var(--leaf);color:#fff;border-radius:18px;padding:10px 12px 10px 18px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:5;font-weight:800}
#bar.show{display:flex}
#bar b{font-size:22px;color:var(--chai)}
#bar button{background:var(--chai);color:#3a2400;font-weight:800;padding:10px 16px;border-radius:12px}
@media(min-width:820px){#bar.show{display:none}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:16px;padding:12px 14px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:26px;color:var(--leaf)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row input[type=date]{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.mini{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;color:var(--leaf)}
.ord{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.ord .no{grid-row:span 2;background:var(--leaf);color:#fff;font-weight:800;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ord .who{font-weight:800}
.ord .who small{color:var(--mute);font-weight:500;margin-left:6px}
.ord .amt{font-weight:800;font-size:20px;text-align:right}
.ord .its{color:var(--mute);font-size:14px;line-height:1.3}
.ord .del{background:none;color:var(--red);font-size:13px;font-weight:700;text-align:right;padding:0}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:0 8px;border-radius:8px;background:#fdecc8;color:#7a4b00;margin-left:6px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sum span{background:#edf3ea;border-radius:10px;padding:3px 10px;font-weight:700;font-size:14px}
.er{display:grid;grid-template-columns:1fr 1fr 80px 40px;gap:8px;margin-bottom:8px}
.er input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.er button{background:#f9e3e0;color:var(--red);border-radius:10px;font-weight:800}
.add{border-top:2px dashed var(--line);padding-top:12px;margin-top:6px}
#toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);background:#17261e;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:transform .25s;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>தேநீர் கடை<br><small style="font-size:13px;font-weight:500;opacity:.8">Tea shop billing</small></h1>
    <div class="today">இன்றைய வசூல்<b id="hTotal">₹0</b><span id="hCnt"></span></div>
  </div>
  <nav>
    <button id="t-bill" class="on" onclick="go('bill')">Bill</button>
    <button id="t-day" onclick="go('day')">இன்று / Today</button>
    <button id="t-items" onclick="go('items')">Items</button>
  </nav>
</header>

<main>
<section id="s-bill" class="on">
  <div class="split">
    <div class="grid" id="grid"></div>
    <div class="card" id="billPanel">
      <h2>Customer #<span id="tok">1</span></h2>
      <input class="name" id="cname" placeholder="Customer name (optional)" maxlength="40" oninput="cust=this.value">
      <div class="lines" id="lines"></div>
      <div class="total"><span>மொத்தம் / Total</span><span id="total">₹0</span></div>
      <div class="pay" id="pay">
        <button class="on" onclick="setPay('Cash')">Cash</button>
        <button onclick="setPay('UPI')">UPI</button>
      </div>
      <button class="cta" id="recv" onclick="receive()" disabled>Payment received</button>
      <button class="ghost" onclick="clearBill()">Clear bill</button>
    </div>
  </div>
</section>

<section id="s-day">
  <div class="row">
    <input type="date" id="dpick" onchange="day=this.value||todayKey();renderDay()">
    <button class="mini" onclick="day=todayKey();dpick.value=day;renderDay()">Today</button>
    <button class="mini" onclick="csv()">Download CSV</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="card"><h2>Item-wise sales</h2><div class="sum" id="isum"></div></div>
  <div id="orders"></div>
</section>

<section id="s-items">
  <div class="card">
    <h2>Items and prices</h2>
    <div id="elist"></div>
    <div class="add">
      <div class="er" style="grid-template-columns:1fr 1fr 80px 80px">
        <input id="nn" placeholder="Name">
        <input id="ne" placeholder="English (optional)">
        <input id="np" type="number" inputmode="decimal" min="0" placeholder="₹">
        <button class="mini" style="background:var(--leaf);color:#fff;border-color:var(--leaf)" onclick="addItem()">Add</button>
      </div>
    </div>
  </div>
</section>
</main>

<div id="bar"><span><b id="bTot">₹0</b> &nbsp;<span id="bCnt"></span></span><button onclick="document.getElementById('billPanel').scrollIntoView({behavior:'smooth'})">View bill</button></div>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rs=n=>'₹'+(Math.round(n*100)/100);
const key=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const todayKey=()=>key(Date.now());
const tm=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

const DEFAULT=[
 ['தேநீர்','Tea',10],['காபி','Coffee',15],['பால்','Milk',12],['சுக்கு காபி','Sukku coffee',12],
 ['எலுமிச்சை டீ','Lemon tea',12],['பாதாம் பால்','Badam milk',20],['பன்','Bun',10],['பிஸ்கட்','Biscuit',5],
 ['சமோசா','Samosa',10],['வடை','Vadai',8],['பஜ்ஜி','Bajji',10],['போண்டா','Bonda',8]
].map((a,i)=>({id:'d'+i,n:a[0],e:a[1],p:a[2]}));

let items=load('tk-items',DEFAULT),orders=load('tk-orders',[]),bill={},cust='',payM='Cash',day=todayKey();

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function go(t){['bill','day','items'].forEach(x=>{$('s-'+x).classList.toggle('on',x===t);$('t-'+x).classList.toggle('on',x===t)});if(t==='day'){day=todayKey();$('dpick').value=day;renderDay()}if(t==='items')renderItems();renderBar()}

/* billing */
function lines(){return items.filter(i=>bill[i.id]>0).map(i=>({i,q:bill[i.id]}))}
function add(id){bill[id]=(bill[id]||0)+1;renderBill()}
function dec(id){bill[id]=(bill[id]||0)-1;if(bill[id]<=0)delete bill[id];renderBill()}
function setPay(m){payM=m;[...$('pay').children].forEach(b=>b.classList.toggle('on',b.textContent===m))}
function clearBill(){bill={};cust='';$('cname').value='';renderBill()}
function renderBill(){
  $('grid').innerHTML=items.map(i=>{const q=bill[i.id]||0;return `<button class="it ${q?'on':''}" onclick="add('${i.id}')"><span class="n">${esc(i.n)}</span><span class="e">${esc(i.e||'')}</span><span class="p">${rs(i.p)}</span>${q?`<b class="q">${q}</b>`:''}</button>`}).join('');
  const L=lines();let tot=0,cnt=0;
  $('lines').innerHTML=L.length?L.map(({i,q})=>{tot+=i.p*q;cnt+=q;return `<div class="ln"><div class="t">${esc(i.n)}<small>${rs(i.p)} each</small></div><div class="step"><button aria-label="less" onclick="dec('${i.id}')">−</button><span>${q}</span><button aria-label="more" onclick="add('${i.id}')">+</button></div><div class="a">${rs(i.p*q)}</div></div>`}).join(''):'<div class="empty">Tap an item to add it to the bill</div>';
  $('total').textContent=rs(tot);$('recv').disabled=!L.length;
  $('recv').textContent=L.length?'Payment received  '+rs(tot):'Payment received';
  $('tok').textContent=orders.filter(o=>key(o.ts)===todayKey()).length+1;
  $('bTot').textContent=rs(tot);$('bCnt').textContent=cnt+(cnt===1?' item':' items');
  renderBar();renderHead();
}
function renderBar(){$('bar').classList.toggle('show',$('s-bill').classList.contains('on')&&lines().length>0)}
function renderHead(){
  const o=orders.filter(x=>key(x.ts)===todayKey());
  $('hTotal').textContent=rs(o.reduce((s,x)=>s+x.total,0));
  $('hCnt').textContent=o.length+(o.length===1?' customer':' customers');
}
function receive(){
  const L=lines();if(!L.length)return;
  const total=L.reduce((s,{i,q})=>s+i.p*q,0);
  const token=orders.filter(o=>key(o.ts)===todayKey()).length+1;
  orders.push({id:Date.now(),ts:Date.now(),token,name:cust.trim(),pay:payM,total,items:L.map(({i,q})=>({n:i.n,p:i.p,q}))});
  save('tk-orders',orders);
  toast('Customer #'+token+' saved. '+rs(total)+' received by '+payM);
  clearBill();
}

/* today */
function renderDay(){
  const o=orders.filter(x=>key(x.ts)===day).sort((a,b)=>b.ts-a.ts);
  const sum=f=>o.filter(f).reduce((s,x)=>s+x.total,0);
  $('stats').innerHTML=`<div class="stat"><small>Customers</small><b>${o.length}</b></div><div class="stat"><small>Total sales</small><b>${rs(sum(()=>1))}</b></div><div class="stat"><small>Cash</small><b>${rs(sum(x=>x.pay==='Cash'))}</b></div><div class="stat"><small>UPI</small><b>${rs(sum(x=>x.pay==='UPI'))}</b></div>`;
  const m={};o.forEach(x=>x.items.forEach(i=>m[i.n]=(m[i.n]||0)+i.q));
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  $('isum').innerHTML=e.length?e.map(([n,q])=>`<span>${esc(n)} × ${q}</span>`).join(''):'<span style="background:none;color:var(--mute)">No sales on this day</span>';
  $('orders').innerHTML=o.map(x=>`<div class="ord"><div class="no">${x.token}</div><div class="who">${esc(x.name||'Customer #'+x.token)}<small>${tm(x.ts)}</small><span class="tag">${esc(x.pay)}</span></div><div class="amt">${rs(x.total)}</div><div class="its">${x.items.map(i=>esc(i.n)+' × '+i.q).join(', ')}</div><button class="del" onclick="delOrder(${x.id})">Delete</button></div>`).join('');
}
function delOrder(id){if(confirm('Delete this bill?')){orders=orders.filter(o=>o.id!==id);save('tk-orders',orders);renderDay();renderHead();renderBill()}}
function csv(){
  const o=orders.filter(x=>key(x.ts)===day).sort((a,b)=>a.ts-b.ts);
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Token','Time','Customer','Items','Total','Payment'].join(',')].concat(o.map(x=>[x.token,tm(x.ts),q(x.name),q(x.items.map(i=>i.n+' x'+i.q).join('; ')),x.total,x.pay].join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download='tea-sales-'+day+'.csv';a.click();
}

/* items */
function renderItems(){
  $('elist').innerHTML=items.map(i=>`<div class="er"><input value="${esc(i.n)}" onchange="upd('${i.id}','n',this.value)" aria-label="Name"><input value="${esc(i.e||'')}" onchange="upd('${i.id}','e',this.value)" aria-label="English name"><input type="number" inputmode="decimal" min="0" value="${i.p}" onchange="upd('${i.id}','p',this.value)" aria-label="Price"><button onclick="rem('${i.id}')" aria-label="Delete item">✕</button></div>`).join('');
}
function upd(id,f,v){const i=items.find(x=>x.id===id);if(!i)return;i[f]=f==='p'?Math.max(0,Number(v)||0):v.trim();save('tk-items',items);renderBill()}
function rem(id){const i=items.find(x=>x.id===id);if(i&&confirm('Remove '+i.n+'?')){items=items.filter(x=>x.id!==id);delete bill[id];save('tk-items',items);renderItems();renderBill()}}
function addItem(){
  const n=$('nn').value.trim(),p=Math.max(0,Number($('np').value)||0);
  if(!n){toast('Enter an item name');return}
  items.push({id:'u'+Date.now(),n,e:$('ne').value.trim(),p});save('tk-items',items);
  $('nn').value=$('ne').value=$('np').value='';renderItems();renderBill();toast(n+' added');
}

renderBill();
</script>
</body>
</html>
